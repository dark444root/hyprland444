# Pantalla de bloqueo · Tema MACOS

general {
    hide_cursor = false
}

background {
    path = ~/.config/hypr/bloqueo/fondo.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.8
}

# Fecha arriba, hora grande debajo
label {
    text = cmd[update:60000] echo "$(date +'%A %d de %B')"
    color = rgba(f5f5f7dd)
    font_size = 22
    font_family = Inter SemiBold
    position = 0, -40
    halign = center
    valign = top
}
label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(f5f5f7ee)
    font_size = 120
    font_family = Inter Bold
    position = 0, -70
    halign = center
    valign = top
}

# Avatar centrado con el nombre (estilo Mac)
shape {
    size = 273, 273
    color = rgba(8e8e93ff)
    rounding = -1
    position = 0, 10
    halign = center
    valign = center
}

# Foto de perfil (se cambia con Windows + Alt + P). Si no hay foto, se ve un círculo gris.
image {
    path = ~/.config/hypr/bloqueo/perfil.png
    size = 273
    rounding = -1
    border_size = 2
    border_color = rgba(ffffff55)
    position = 0, 10
    halign = center
    valign = center
}
label {
    text = __NOMBRE__
    color = rgba(f5f5f7ff)
    font_size = 24
    font_family = Inter Bold
    position = 0, -150
    halign = center
    valign = center
}

input-field {
    size = 320, 48
    outline_thickness = 0
    inner_color = rgba(ffffff33)
    font_color = rgba(ffffffff)
    check_color = rgba(0a84ffff)
    fail_color = rgba(ff5f57ff)
    placeholder_text = Introduce la contraseña
    fail_text = Contraseña incorrecta
    dots_center = true
    dots_size = 0.25
    fade_on_empty = false
    rounding = 24
    position = 0, -215
    halign = center
    valign = center
    font_size = 16
}
