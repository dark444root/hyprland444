# ============================================================
#  Prompt "Cápsulas" para la terminal (starship)
#  Línea 1: sistema · usuario · carpeta · git · lenguaje · hora
#  Línea 2: flecha que se pone roja si el último comando falló
# ============================================================
add_newline = true
command_timeout = 400

format = """
[](fg:#ff5f87)\
$os$username\
[](fg:#ff5f87 bg:#9d7cff)\
$directory\
[](fg:#9d7cff bg:#4cc9f0)\
$git_branch$git_status\
[](fg:#4cc9f0 bg:#5ef2c2)\
$python$nodejs$java$rust$golang$php$c\
[](fg:#5ef2c2 bg:#ffc777)\
$time\
[](fg:#ffc777)\
$cmd_duration
$character"""

[os]
disabled = false
style = "bg:#ff5f87 fg:#1a1b26"
format = "[ $symbol]($style)"
[os.symbols]
Debian = ""
Kali = ""
Ubuntu = ""
Arch = ""
Linux = ""

[username]
show_always = true
style_user = "bg:#ff5f87 fg:#1a1b26 bold"
style_root = "bg:#ff5f87 fg:#ffffff bold"
format = "[ $user ]($style)"

[directory]
style = "bg:#9d7cff fg:#1a1b26 bold"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documentos" = "󰈙 Documentos"
"Descargas" = " Descargas"
"Escritorio" = " Escritorio"
"Imágenes" = " Imágenes"
"Música" = " Música"
"Projects" = " Projects"

[git_branch]
symbol = ""
style = "bg:#4cc9f0 fg:#1a1b26 bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#4cc9f0 fg:#1a1b26 bold"
format = "[($all_status$ahead_behind )]($style)"
modified = "!"
untracked = "?"
staged = "+"
ahead = "⇡"
behind = "⇣"

[python]
symbol = ""
style = "bg:#5ef2c2 fg:#1a1b26"
format = "[ $symbol ($version) ]($style)"
[nodejs]
symbol = ""
style = "bg:#5ef2c2 fg:#1a1b26"
format = "[ $symbol ($version) ]($style)"
[java]
symbol = ""
style = "bg:#5ef2c2 fg:#1a1b26"
format = "[ $symbol ($version) ]($style)"
[rust]
symbol = ""
style = "bg:#5ef2c2 fg:#1a1b26"
format = "[ $symbol ($version) ]($style)"
[golang]
symbol = ""
style = "bg:#5ef2c2 fg:#1a1b26"
format = "[ $symbol ($version) ]($style)"
[php]
symbol = ""
style = "bg:#5ef2c2 fg:#1a1b26"
format = "[ $symbol ($version) ]($style)"
[c]
symbol = ""
style = "bg:#5ef2c2 fg:#1a1b26"
format = "[ $symbol ($version) ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:#ffc777 fg:#1a1b26 bold"
format = "[  $time ]($style)"

[cmd_duration]
min_time = 2000
style = "fg:#ffc777"
format = " [took $duration]($style)"

[character]
success_symbol = "[ ❯](bold #5ef2c2)"
error_symbol = "[ ❯](bold #ff5f87)"
