# ============================================================
#   Hyprland · Tema "AURORA"
#   Auroras boreales sobre montañas: menta, cian y violeta
#   Respaldo del tema anterior: ~/.config/hypr/respaldo-nocturno/
#   Cambiar de tema: Windows + Alt + T
# ============================================================

# ---------- Monitor ----------
# Si se ve muy pequeño, cambia el último 1 por 1.25
monitor = , preferred, auto, 1

# ---------- Programas ----------
$terminal    = kitty
$menu        = bash ~/.config/hypr/scripts/menu-apps.sh
$runner      = pkill wofi || wofi --show run
$archivos    = thunar
$navegador   = firefox-esr
$energia     = bash ~/.config/hypr/scripts/menu-energia.sh
$wallpaper   = ~/.config/hypr/wallpapers/actual.png

# ---------- Autoinicio ----------
# Pantalla de bloqueo al encender (con inicio de sesión automático)
exec-once = hyprlock
exec-once = waybar
exec-once = mako
# Fondos por escritorio (Windows + W) y apps en su escritorio (apps-escritorios.conf)
exec-once = python3 ~/.config/hypr/scripts/fondos-escritorio.py
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = notify-send -a "Aurora" "Bienvenido, __NOMBRE__" "Presiona la tecla Windows para abrir tus apps"

# Widget de escritorio (foto + hora + clima) en todos los escritorios
exec-once = bash ~/.config/hypr/scripts/widget.sh

# ---------- Variables de entorno ----------
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1

# ---------- Teclado y touchpad ----------
input {
    kb_layout = latam
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# ============================================================
#  Apariencia: la pone el tema activo (cámbialo con Windows + Alt + T)
#  Temas disponibles en ~/.config/hypr/temas/
# ============================================================
source = ~/.config/hypr/tema.conf

binds {
    # Al cambiar de escritorio se cierran los escritorios especiales
    # (minimizadas, terminal desplegable, bolsillo) para que no se queden encima
    hide_special_on_workspace_change = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    animate_manual_resizes = true
    # vfr: no redibuja si nada cambia (ahorra batería)
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ============================================================
#  Atajos (SUPER = tecla Windows)
# ============================================================
$mod = SUPER

# >>> Presionar y soltar solo la tecla Windows abre/cierra el menú de apps
bindr = $mod, SUPER_L, exec, $menu

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, R, exec, $runner
# Buscador rápido (estilo Spotlight)
bind = $mod, Space, exec, pkill wofi || wofi --show drun
bind = $mod, E, exec, $archivos
bind = $mod, B, exec, $navegador
bind = $mod, Q, killactive
bind = ALT, F4, killactive

# Minimizar / restaurar ventanas
bind = $mod, M, exec, bash ~/.config/hypr/scripts/minimizar.sh
bind = $mod SHIFT, M, exec, bash ~/.config/hypr/scripts/restaurar.sh
bind = $mod CTRL, M, exec, bash ~/.config/hypr/scripts/restaurar.sh --todas

# Terminal desplegable: aparece y se esconde con Windows + T
workspace = special:terminal, on-created-empty:kitty
bind = $mod, T, togglespecialworkspace, terminal
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, L, exec, hyprlock
bind = $mod, X, exec, $energia
bind = $mod SHIFT, E, exit
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, B, exec, pkill waybar || waybar
bind = $mod ALT, T, exec, bash ~/.config/hypr/scripts/cambiar-tema.sh
# Widget: mostrar/ocultar y cambiar foto
bind = $mod ALT, W, exec, bash ~/.config/hypr/scripts/widget.sh toggle
bind = $mod ALT, F, exec, bash ~/.config/hypr/scripts/widget-foto.sh
bind = $mod ALT, A, exec, python3 ~/.config/hypr/scripts/elegir-app.py apps todas
bind = $mod ALT, J, exec, python3 ~/.config/hypr/scripts/elegir-app.py juegos todas
bind = $mod ALT, C, exec, bash ~/.config/hypr/scripts/cursor.sh
bind = $mod ALT, L, exec, bash ~/.config/hypr/scripts/elegir-bloqueo.sh
bind = $mod ALT, P, exec, bash ~/.config/hypr/scripts/elegir-perfil.sh
bind = $mod, W, exec, bash ~/.config/hypr/scripts/elegir-fondo.sh
bind = $mod SHIFT, W, exec, bash ~/.config/hypr/scripts/elegir-fondo.sh --aleatorio

# Portapapeles (historial)
bind = $mod, C, exec, cliphist list | wofi --dmenu --prompt "Portapapeles" | cliphist decode | wl-copy

# Capturas de pantalla estilo GNOME (se guardan en Imágenes/Capturas de pantalla y se copian)
bind = , Print, exec, bash ~/.config/hypr/scripts/captura.sh area
bind = $mod SHIFT, S, exec, bash ~/.config/hypr/scripts/captura.sh area
bind = ALT, Print, exec, bash ~/.config/hypr/scripts/captura.sh ventana
bind = SHIFT, Print, exec, bash ~/.config/hypr/scripts/captura.sh pantalla

# Mover foco con flechas
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Mover ventanas
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Redimensionar con teclado
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0 40

# Escritorios 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Escritorio "bolsillo" (scratchpad) — aparece y desaparece
bind = $mod, S, togglespecialworkspace, bolsillo
bind = $mod ALT, S, movetoworkspace, special:bolsillo

# Cambiar escritorio con la rueda / Tab
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod, Tab, workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1

# Mover / redimensionar con el mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Teclas de la laptop: volumen, brillo y multimedia
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Barras de título estilo Mac (las define el tema activo)
exec-once = hyprpm reload -n
source = ~/.config/hypr/hyprbars.conf

# Mejoras visuales (se quitan con revertir-mejoras.sh)
source = ~/.config/hypr/mejoras.conf

# Cursor del mouse (lo cambia cursor.sh con Windows + Alt + C)
source = ~/.config/hypr/cursor.conf
