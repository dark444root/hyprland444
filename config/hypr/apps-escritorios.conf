# ============================================================
#  Apps por escritorio: cada app se abre (o se mueve) a su escritorio
#  Formato:  partes-del-nombre-de-la-app = número de escritorio
#  Para ver el nombre exacto de una app abierta:  hyprctl clients | grep class
#  Después de editar:  pkill -USR1 -f fondos-escritorio.py
#  Si no quieres que una app tenga escritorio fijo, borra su nombre o pon # al inicio.
# ============================================================

# 1 · General (terminal y lo que no esté en la lista se abre donde estés)

# 2 · Navegador
firefox, chrom, brave, edge = 2

# 3 · Programación
code, cursor, jetbrains, android-studio, postman, mongodb = 3

# 4 · Archivos y documentos
thunar, nautilus, libreoffice, evince, papers = 4

# 5 · Multimedia y chat
spotify, discord, telegram, mpv, vlc, steam = 5
