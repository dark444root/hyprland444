# Tema MACOS · modo oscuro estilo macOS
# ============================================================
#  Paleta
#   ventana #1e1e1e  barra #2a2a2a  texto #f5f5f7  secundario #a1a1a6
#   azul #0a84ff   rojo #ff5f57   amarillo #febc2e   verde #28c840
# ============================================================

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(ffffff26)
    col.inactive_border = rgba(ffffff12)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false

    blur {
        enabled = true
        size = 8
        passes = 2
        xray = true
        new_optimizations = true
        noise = 0.015
        contrast = 1.0
        brightness = 0.95
        vibrancy = 0.2
        popups = true
    }

    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0, 10
        color = rgba(00000099)
        color_inactive = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = mac,    0.25, 1, 0.5, 1
    bezier = genio,  0.4, 0, 0.2, 1
    bezier = salida, 0.5, 0, 0.75, 0

    animation = windows,     1, 3, mac, popin 85%
    animation = windowsOut,  1, 3, salida, popin 85%
    animation = windowsMove, 1, 4, mac
    animation = border,      1, 4, default
    animation = fade,        1, 2, mac
    animation = layers,      1, 2, mac, popin 95%
    animation = workspaces,  1, 5, genio, slide
    animation = specialWorkspace, 1, 4, mac, slidevert
}
