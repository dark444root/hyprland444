# Barras de título · Tema WINDOWS  (minimizar — maximizar □ cerrar ✕ a la derecha)
plugin {
    hyprbars {
        bar_height = 32
        bar_color = rgba(202020f5)
        col.text = rgba(ffffffff)
        bar_text_font = Noto Sans
        bar_text_size = 10
        bar_text_align = left
        bar_padding = 14
        bar_button_padding = 14
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_buttons_alignment = right

        # El primero queda más a la derecha
        hyprbars-button = rgba(c42b1c00), 14, ✕, hyprctl dispatch killactive, rgba(ffffffff)
        hyprbars-button = rgba(ffffff00), 14, □, hyprctl dispatch fullscreen 1, rgba(ffffffff)
        hyprbars-button = rgba(ffffff00), 14, —, bash ~/.config/hypr/scripts/minimizar.sh, rgba(ffffffff)

        on_double_click = hyprctl dispatch fullscreen 1
    }
}
