# Tema WINDOWS · estilo Windows 11 (modo oscuro, acento azul)
# ============================================================
#  Paleta
#   fondo #202020   superficie #2b2b2b   texto #ffffff
#   acento #60cdff  texto secundario #c5c5c5
# ============================================================

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(60cdff99)
    col.inactive_border = rgba(ffffff1a)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false

    blur {
        enabled = true
        size = 6
        passes = 2
        xray = true
        new_optimizations = true
        noise = 0.02
        brightness = 0.85
        popups = true
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        offset = 0, 4
        color = rgba(00000077)
        color_inactive = rgba(00000044)
    }
}

animations {
    enabled = true
    bezier = fluent, 0.1, 0.9, 0.2, 1
    bezier = salida, 0.7, 0, 1, 0.5

    animation = windows,     1, 3, fluent, popin 92%
    animation = windowsOut,  1, 2, salida, popin 92%
    animation = windowsMove, 1, 3, fluent
    animation = border,      1, 4, default
    animation = fade,        1, 2, fluent
    animation = layers,      1, 2, fluent, slide bottom
    animation = workspaces,  1, 4, fluent, slide
    animation = specialWorkspace, 1, 3, fluent, slidevert
}
