# Barras de título · Tema MACOS (semáforo a la izquierda, título centrado)
plugin {
    hyprbars {
        bar_height = 28
        bar_color = rgba(2a2a2af5)
        col.text = rgba(d1d1d6ff)
        bar_text_font = Inter
        bar_text_size = 10
        bar_text_align = center
        bar_padding = 12
        bar_button_padding = 8
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_buttons_alignment = left

        hyprbars-button = rgb(ff5f57), 12, , hyprctl dispatch killactive
        hyprbars-button = rgb(febc2e), 12, , bash ~/.config/hypr/scripts/minimizar.sh
        hyprbars-button = rgb(28c840), 12, , hyprctl dispatch fullscreen 1

        on_double_click = hyprctl dispatch fullscreen 1
    }
}
