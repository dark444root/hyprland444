# Pantalla de bloqueo · Tema CIELO

general {
    hide_cursor = false
}

background {
    path = ~/.config/hypr/bloqueo/fondo.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffff)
    font_size = 110
    font_family = Noto Sans SemiBold
    position = 0, 260
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(ffffffff)
    font_size = 22
    font_family = Noto Sans
    position = 0, 160
    halign = center
    valign = center
}

# Avatar con la inicial
shape {
    size = 238, 238
    color = rgba(7fb4ffff)
    rounding = -1
    position = 0, 10
    halign = center
    valign = center
}

# Foto de perfil (se cambia con Windows + Alt + P). Si no hay foto, se ve un círculo gris.
image {
    path = ~/.config/hypr/bloqueo/perfil.png
    size = 238
    rounding = -1
    border_size = 2
    border_color = rgba(ffffff55)
    position = 0, 10
    halign = center
    valign = center
}

label {
    text = __NOMBRE__
    color = rgba(ffffffff)
    font_size = 20
    font_family = Noto Sans SemiBold
    position = 0, -150
    halign = center
    valign = center
}

input-field {
    size = 300, 42
    outline_thickness = 1
    outer_color = rgba(ffffff33)
    inner_color = rgba(202020cc)
    font_color = rgba(ffffffff)
    check_color = rgba(7fb4ffff)
    fail_color = rgba(ff99a4ff)
    placeholder_text = Contraseña
    fail_text = Intenta de nuevo
    dots_center = true
    fade_on_empty = false
    rounding = 21
    position = 0, -215
    halign = center
    valign = center
}
