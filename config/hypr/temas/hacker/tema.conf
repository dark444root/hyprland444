# Tema HACKER · Netrunner: magenta neón + cian eléctrico sobre negro violáceo
# ============================================================
#  Paleta Netrunner
#   fondo #07040d   magenta #ff2a6d   cian #05d9e8
#   violeta #b967ff  violeta oscuro #3a1050  amarillo #f9f002
# ============================================================

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ff2a6dcc)
    col.inactive_border = rgba(2a1838aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 3
    active_opacity = 0.97
    inactive_opacity = 0.82
    dim_inactive = true
    dim_strength = 0.15

    blur {
        enabled = true
        size = 4
        passes = 2
        xray = true
        new_optimizations = true
        noise = 0.06
        contrast = 1.3
        brightness = 0.7
        vibrancy = 0.1
        popups = true
    }

    shadow {
        enabled = true
        range = 14
        render_power = 2
        offset = 0, 0
        color = rgba(00000088)
        color_inactive = rgba(07040dcc)
    }
}

animations {
    enabled = true
    bezier = glitch, 0.9, 0, 0.1, 1
    bezier = seco,   0.2, 1, 0.3, 1
    bezier = lineal, 0, 0, 1, 1

    animation = windows,     1, 3, seco, popin 90%
    animation = windowsOut,  1, 2, glitch, popin 95%
    animation = windowsMove, 1, 3, seco
    animation = border,      1, 6, default
    animation = fade,        1, 2, lineal
    animation = layers,      1, 2, seco, slide top
    animation = workspaces,  1, 3, glitch, slidevert
    animation = specialWorkspace, 1, 3, seco, slidevert
}
