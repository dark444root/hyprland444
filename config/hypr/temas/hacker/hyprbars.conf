# Barras de título · Tema HACKER (Netrunner, semáforo Mac en neón)
plugin {
    hyprbars {
        bar_height = 26
        bar_color = rgba(07040df2)
        col.text = rgba(05d9e8ff)
        bar_text_font = JetBrains Mono
        bar_text_size = 10
        bar_text_align = center
        bar_padding = 10
        bar_button_padding = 7
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_buttons_alignment = left

        hyprbars-button = rgb(ff2a6d), 12, , hyprctl dispatch killactive
        hyprbars-button = rgb(f9f002), 12, , bash ~/.config/hypr/scripts/minimizar.sh
        hyprbars-button = rgb(05d9e8), 12, , hyprctl dispatch fullscreen 1

        on_double_click = hyprctl dispatch fullscreen 1
    }
}
