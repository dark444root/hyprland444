# Pantalla de bloqueo · Tema HACKER

general {
    hide_cursor = true
}

background {
    path = ~/.config/hypr/bloqueo/fondo.png
    blur_passes = 1
    blur_size = 3
    brightness = 0.55
}

label {
    text = [ ACCESO RESTRINGIDO ]
    color = rgba(ff2a6dff)
    font_size = 18
    font_family = JetBrains Mono ExtraBold
    position = 0, 300
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color = rgba(05d9e8ff)
    font_size = 110
    font_family = JetBrains Mono ExtraBold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(ff2a6dcc)
    position = 0, 170
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] echo "netrunner@$USER :: $(date +'%Y-%m-%d') :: sesión bloqueada"
    color = rgba(b967ffff)
    font_size = 15
    font_family = JetBrains Mono
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    size = 380, 52
    outline_thickness = 2
    outer_color = rgba(ff2a6dff) rgba(05d9e8ff) 90deg
    inner_color = rgba(07040dee)
    font_color = rgba(05d9e8ff)
    check_color = rgba(f9f002ff)
    fail_color = rgba(ff3b3bff)
    placeholder_text = INGRESA CONTRASEÑA_
    fail_text = ACCESO DENEGADO
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    rounding = 0
    position = 0, -50
    halign = center
    valign = center
}

label {
    text = > autenticación requerida para continuar
    color = rgba(b967ff99)
    font_size = 11
    font_family = JetBrains Mono
    position = 0, -110
    halign = center
    valign = center
}
