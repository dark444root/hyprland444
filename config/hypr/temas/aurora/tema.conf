# Tema AURORA · colores, bordes y animaciones de Hyprland
# ============================================================
#  Paleta Aurora
#   fondo  #0a0d1c   superficie #121730   texto #e2e6ff
#   menta  #5ef2c2   cian #4cc9f0   azul #6c8cff
#   violeta #9d7cff  rosa #ff7ac6   ámbar #ffc777
# ============================================================

general {
    gaps_in = 7
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(5ef2c2cc)
    col.inactive_border = rgba(1b2142aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 16
    active_opacity = 1.0
    inactive_opacity = 0.90
    dim_inactive = true
    dim_strength = 0.08

    blur {
        enabled = true
        size = 6
        passes = 2
        xray = true
        new_optimizations = true
        noise = 0.02
        contrast = 1.1
        brightness = 0.9
        vibrancy = 0.25
        popups = true
    }

    shadow {
        enabled = true
        range = 16
        render_power = 2
        offset = 0, 6
        color = rgba(00000088)
        color_inactive = rgba(05060ccc)
    }
}

animations {
    enabled = true
    bezier = rebote,  0.34, 1.56, 0.64, 1
    bezier = suave,   0.05, 0.9,  0.1,  1.05
    bezier = salida,  0.3,  0,    0.8,  0.15
    bezier = lineal,  0, 0, 1, 1

    animation = windows,     1, 3,  rebote, popin 75%
    animation = windowsOut,  1, 4,  salida, popin 85%
    animation = windowsMove, 1, 5,  suave
    animation = border,      1, 10, default
    animation = fade,        1, 2,  suave
    animation = layers,      1, 2,  rebote, popin 90%
    animation = workspaces,  1, 6,  suave, slidefade 15%
    animation = specialWorkspace, 1, 5, rebote, slidevert
}

