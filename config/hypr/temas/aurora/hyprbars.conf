# ============================================================
#  Barras de título estilo macOS · Tema AURORA  (plugin hyprbars)
#  Semáforo a la izquierda:  ● cerrar  ● minimizar  ● maximizar
#  Arrastra la barra para mover la ventana; doble clic = maximizar
# ============================================================
plugin {
    hyprbars {
        bar_height = 30
        bar_color = rgba(121730f2)
        col.text = rgba(b8bfe6ff)
        bar_text_font = JetBrains Mono
        bar_text_size = 10
        bar_text_align = center
        bar_padding = 12
        bar_button_padding = 8
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_buttons_alignment = left

        # Orden desde la izquierda: rojo, amarillo, verde (como en Mac)
        hyprbars-button = rgb(ff5f57), 13, , hyprctl dispatch killactive
        hyprbars-button = rgb(febc2e), 13, , bash ~/.config/hypr/scripts/minimizar.sh
        hyprbars-button = rgb(28c840), 13, , hyprctl dispatch fullscreen 1

        on_double_click = hyprctl dispatch fullscreen 1
    }
}
