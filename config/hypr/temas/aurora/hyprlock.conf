# Pantalla de bloqueo · Tema AURORA

general {
    hide_cursor = true
}

background {
    path = ~/.config/hypr/bloqueo/fondo.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.75
    vibrancy = 0.2
}

# Hora grande
label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(e2e6ffff)
    font_size = 120
    font_family = JetBrains Mono ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(4cc9f088)
    position = 0, 200
    halign = center
    valign = center
}

# Fecha
label {
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(5ef2c2ff)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 90
    halign = center
    valign = center
}

# Saludo
label {
    text = cmd[update:60000] h=$(date +%H); if [ $h -lt 12 ]; then s="Buenos días"; elif [ $h -lt 19 ]; then s="Buenas tardes"; else s="Buenas noches"; fi; echo "$s, __NOMBRE__"
    color = rgba(8a93c2ff)
    font_size = 15
    font_family = JetBrains Mono Italic
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outline_thickness = 3
    outer_color = rgba(5ef2c2ff) rgba(4cc9f0ff) rgba(9d7cffff) 45deg
    inner_color = rgba(0a0d1cdd)
    font_color = rgba(e2e6ffff)
    check_color = rgba(ffc777ff)
    fail_color = rgba(ff5f87ff)
    fail_text = <i>Intenta de nuevo</i>
    placeholder_text = <i>Contraseña...</i>
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    rounding = 28
    position = 0, -50
    halign = center
    valign = center
}
